<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Каталог товаров магазина ShopProject."
    />
    <title>Каталог товаров — ShopProject</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#1f4d46" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script src="js/theme.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/catalog.js" defer></script>
    <script src="js/validation.js" defer></script>
    <script src="js/main.js" defer></script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ShopProject" />
    <meta
      property="og:description"
      content="Интернет-магазин мягкой мебели: диваны на любой вкус."
    />
    <meta
      property="og:image"
      content="https://goshanka.github.io/kr3-responsive-shop/images/sofa-1.jpg"
    />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Перейти к основному содержимому</a>
    <header class="site-header" id="top">
      <div class="site-header__inner">
        <a class="site-header__logo" href="index.html">ShopProject</a>

        <nav class="site-nav" aria-label="Основная навигация">
          <input class="site-nav__checkbox" type="checkbox" id="nav-toggle" aria-label="Показать меню" />
          <label class="site-nav__toggle" for="nav-toggle" aria-hidden="true"><span class="site-nav__burger"></span>Меню</label>
          <ul class="site-nav__list">
            <li class="site-nav__item">
              <a class="site-nav__link" href="index.html">Главная</a>
            </li>
            <li class="site-nav__item">
              <a class="site-nav__link site-nav__link--active" href="catalog.html">Каталог</a>
            </li>
            <li class="site-nav__item">
              <a class="site-nav__link" href="order.html">Оформить заявку</a>
            </li>
            <li class="site-nav__item">
              <a class="site-nav__link" href="contacts.html">Контакты</a>
            </li>
            <li class="site-nav__item">
              <a class="site-nav__link" href="cart.html">Корзина (<span data-cart-count>0</span>)</a>
            </li>
            <li class="site-nav__item">
              <a class="site-nav__link" href="contacts.html#feedback">Обратная связь</a>
            </li>
          </ul>
        </nav>

        <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false" aria-label="Включить тёмную тему">
          <span class="theme-toggle__icon" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <main id="main-content">
      <nav class="breadcrumbs" aria-label="Хлебные крошки">
        <a class="breadcrumbs__link" href="index.html">Главная</a>
        <span class="breadcrumbs__current">Каталог</span>
      </nav>

      <h1 class="page-title">Каталог товаров</h1>

      <section class="catalog-controls" aria-label="Поиск, фильтр и сортировка">
        <div>
          <label for="search">Поиск по названию</label>
          <input id="search" type="search" placeholder="Например, Nordic" />
        </div>
        <div>
          <label for="category">Категория</label>
          <select id="category">
            <option value="all">Все категории</option>
            <option value="classic">Классика</option>
            <option value="scandi">Скандинавский стиль</option>
            <option value="modern">Современные</option>
          </select>
        </div>
        <div>
          <label for="sort">Сортировка</label>
          <select id="sort">
            <option value="default">По умолчанию</option>
            <option value="price-asc">Цена: по возрастанию</option>
            <option value="price-desc">Цена: по убыванию</option>
            <option value="title">Название: А–Я</option>
          </select>
        </div>
      </section>

      <p id="catalog-count" role="status"></p>

      <div class="products-grid" id="catalog-grid"></div>

      <div class="catalog-empty" id="catalog-empty" hidden>
        <p>По вашему запросу ничего не найдено.</p>
        <button class="button button--secondary" type="button" id="catalog-reset">Сбросить фильтры</button>
      </div>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 ShopProject. Все права защищены.</p>
    </footer>

    <a class="back-to-top" href="#top" aria-label="Наверх">&uarr;</a>
  </body>
</html>
